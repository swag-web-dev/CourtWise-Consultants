databases:
  - name: courtwise-db
    databaseName: courtwise_cms
    user: courtwise
    region: oregon

services:
  - type: web
    name: courtwise-consultants
    env: node
    region: oregon
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: courtwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
